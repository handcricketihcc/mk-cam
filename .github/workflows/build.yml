name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        run: gradle -p android :device:assembleDebug :viewer:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MKCamDevice-debug-apk
          path: android/device/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MKCamViewer-debug-apk
          path: android/viewer/build/outputs/apk/debug/*.apk
