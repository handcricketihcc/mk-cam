# Render.com Blueprint: free web service for the MK Cam signaling server.
services:
  - type: web
    name: mk-cam-signaling
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SERVER_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "20"
